name: face_swap_app
description: Full-featured mobile face swapping app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core inference and image processing
  onnxruntime: ^1.4.1
  opencv_dart: ^1.4.3
  image: ^4.1.3

  # Camera and video
  camera: ^0.10.5+9
  video_player: ^2.8.3
  image_picker: ^1.0.7
  ffmpeg_kit_flutter_full_gpl: ^6.0.3

  # File and storage
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.1

  # UI
  flutter_spinkit: ^5.2.0
  percent_indicator: ^4.2.3
  wakelock_plus: ^1.1.4

  # Native channel bridge
  flutter_foreground_task: ^6.1.2
  xml: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/blazeface.onnx
    - assets/arcface.onnx
    - assets/inswapper_mobile.onnx
    - assets/images/