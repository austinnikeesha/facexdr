name: Build Release APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: false

      - name: Fix Flutter groovy.xml.QName bug
        run: |
          FLUTTER_GROOVY="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [ -f "$FLUTTER_GROOVY" ]; then
            echo "=== Before patch ==="
            head -50 "$FLUTTER_GROOVY"
            # Remove all groovy.xml imports
            sed -i '/import groovy.xml/d' "$FLUTTER_GROOVY"
            # Remove or replace usages of XmlParser and QName
            sed -i 's/new XmlParser()//g' "$FLUTTER_GROOVY"
            sed -i 's/def manifest = new XmlParser().parse(processResources.manifestFile)/def manifest = null  \/\/ disabled/g' "$FLUTTER_GROOVY"
            sed -i 's/entry.key instanceof QName/false  \/\/ disabled/g' "$FLUTTER_GROOVY"
            sed -i 's/if (entry.key instanceof QName)/if (false)  \/\/ disabled/g' "$FLUTTER_GROOVY"
            echo "=== After patch ==="
            head -80 "$FLUTTER_GROOVY"
            echo "Patched flutter.groovy - removed groovy.xml usage"
          else
            echo "ERROR: flutter.groovy not found at $FLUTTER_GROOVY"
            find /opt/hostedtoolcache -name "flutter.groovy" 2>/dev/null
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true