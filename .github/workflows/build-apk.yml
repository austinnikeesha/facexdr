name: Build Release APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: true

      - name: Fix Flutter groovy.xml.QName bug
        run: |
          FLUTTER_GROOVY="/opt/hostedtoolcache/flutter/stable-3.29.2-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [ -f "$FLUTTER_GROOVY" ]; then
            # First, remove ALL import lines related to groovy.xml
            sed -i '/import groovy.xml/d' "$FLUTTER_GROOVY"
            # Then add the correct imports at the very top
            sed -i '1i import groovy.xml.XmlParser' "$FLUTTER_GROOVY"
            sed -i '1i import groovy.xml.QName' "$FLUTTER_GROOVY"
            echo "Patched flutter.groovy - imports fixed"
            head -20 "$FLUTTER_GROOVY"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true