name: Build Release APK

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ffmpeg:
    name: Build ffmpeg-kit from source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      ffmpeg_dir: ${{ steps.set_output.outputs.ffmpeg_dir }}
    steps:
      - name: Checkout ffmpeg-kit
        uses: actions/checkout@v4
        with:
          repository: arthenica/ffmpeg-kit
          ref: main
          path: ffmpeg-kit

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c

      - name: Build ffmpeg-kit (full-gpl)
        run: |
          cd ffmpeg-kit
          ./build_android.sh --package=full-gpl --ndk-version=r27c --architectures=arm64-v8a,armeabi-v7a,x86,x86_64
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      - name: Set output
        id: set_output
        run: |
          echo "ffmpeg_dir=$(pwd)/ffmpeg-kit/output" >> $GITHUB_OUTPUT

      - name: Upload ffmpeg artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-artifacts
          path: ffmpeg-kit/output/
          retention-days: 7

  build-app:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-ffmpeg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ffmpeg artifacts
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-artifacts
          path: ffmpeg-artifacts

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'
          cache: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          ndk-version: r27c

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Fix Flutter groovy.xml.QName bug
        run: |
          FLUTTER_GROOVY="/opt/hostedtoolcache/flutter/stable-3.29.2-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
          if [ -f "$FLUTTER_GROOVY" ]; then
            echo "=== Before patch ==="
            head -30 "$FLUTTER_GROOVY"
            sed -i '/import groovy.xml/d' "$FLUTTER_GROOVY"
            sed -i 's/new XmlParser()/null \/\/ disabled/g' "$FLUTTER_GROOVY"
            sed -i 's/entry.key instanceof QName/false \/\/ disabled/g' "$FLUTTER_GROOVY"
            sed -i 's/if (entry.key instanceof QName)/if (false) \/\/ disabled/g' "$FLUTTER_GROOVY"
            echo "=== After patch ==="
            head -30 "$FLUTTER_GROOVY"
            echo "Patched flutter.groovy - removed groovy.xml usage"
          else
            echo "ERROR: flutter.groovy not found at $FLUTTER_GROOVY"
            find /opt/hostedtoolcache -name "flutter.groovy" 2>/dev/null
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter setup
        run: flutter doctor -v

      - name: Copy ffmpeg artifacts to local maven repo
        run: |
          mkdir -p ~/.m2/repository/com/arthenica
          cp -r ffmpeg-artifacts/* ~/.m2/repository/com/arthenica/

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
